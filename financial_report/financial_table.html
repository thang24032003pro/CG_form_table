<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Báo cáo Tài chính DataCorp - Quý 1 2026</title>
    <style>
        table { width: 90%; border-collapse: collapse; margin: 20px auto; font-family: sans-serif; }
        th, td { border: 1px solid #000; padding: 10px; text-align: center; }
        thead { background-color: #d1d1d1; }
        tfoot { background-color: #f9f9f9; font-weight: bold; }
        .region-cell { background-color: #f0f0f0; font-weight: bold; }
    </style>
</head>
<body>

    <table>
        <caption><h3>BÁO CÁO DOANH THU CHI TIẾT - QUÝ 1/2026</h3></caption>
        <thead>
            <tr>
                <th rowspan="2">Khu vực</th>
                <th rowspan="2">Hạng mục sản phẩm</th>
                <th colspan="3">Doanh thu theo tháng (USD)</th>
            </tr>
            <tr>
                <th>Tháng 1</th>
                <th>Tháng 2</th>
                <th>Tháng 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" class="region-cell">Châu Á</td>
                <td>Phần cứng</td>
                <td>500$</td>
                <td>600$</td>
                <td>550$</td>
            </tr>
            <tr>
                <td>Phần mềm</td>
                <td>1000$</td>
                <td>1200$</td>
                <td>1100$</td>
            </tr>
            <tr>
                <td class="region-cell">Châu Âu</td>
                <td>Phần mềm</td>
                <td>800$</td>
                <td>900$</td>
                <td>950$</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">TỔNG LỢI NHUẬN TOÀN CẦU</td>
                <td>2300$</td>
                <td>2700$</td>
                <td>2600$</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
